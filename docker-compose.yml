services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
  identity-staff-service:
    build:
      context: .
      args:
        MODULE: services/identity-staff-service
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  appointment-queue-service:
    build:
      context: .
      args:
        MODULE: services/appointment-queue-service
    ports: ["127.0.0.1:8082:8082"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/appointment_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  patient-medical-service:
    build:
      context: .
      args:
        MODULE: services/patient-medical-service
    ports: ["127.0.0.1:8083:8083"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/medical_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      IDENTITY_URL: http://identity-staff-service:8081
      APPOINTMENT_URL: http://appointment-queue-service:8082
      MEDICAL_URL: http://patient-medical-service:8083
  web-app:
    build:
      context: .
      args:
        MODULE: web-app
    ports: ["127.0.0.1:8090:8090"]
    environment:
      GATEWAY_URL: http://api-gateway:8080
volumes:
  postgres-data:
