spring.application.name=api-gateway
server.port=8080
spring.profiles.default=local
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.cloud.gateway.server.webmvc.routes[0].id=identity
spring.cloud.gateway.server.webmvc.routes[0].uri=${IDENTITY_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/identity/**
spring.cloud.gateway.server.webmvc.routes[1].id=appointments
spring.cloud.gateway.server.webmvc.routes[1].uri=${APPOINTMENT_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/appointments/**
spring.cloud.gateway.server.webmvc.routes[2].id=medical
spring.cloud.gateway.server.webmvc.routes[2].uri=${MEDICAL_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/medical/**
